<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark slate drop shadow to give depth to foreground elements -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#050a12" flood-opacity="0.4" />
    </filter>

    <!-- Linear gradient for the vibrant orange weight bars -->
    <linearGradient id="orange-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>

    <!-- Linear gradient for the electric-to-sky-blue checkmark -->
    <linearGradient id="blue-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005BFF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
  </defs>

  <!-- Background: Single squircle conforming to Android Icon standards -->
  <rect x="0" y="0" width="512" height="512" rx="140" ry="140" fill="#0E1E2E" />

  <!-- Inner Content Group (centered) -->
  <g transform="translate(10, 0)" filter="url(#soft-shadow)">
    <!-- Weight Bar 1 (Far Left, Shorter & Vertical) -->
    <rect x="82" y="166" width="46" height="180" rx="23" fill="url(#orange-grad)" />
    
    <!-- Weight Bar 2 (Middle, Taller & Vertical) -->
    <rect x="156" y="116" width="48" height="280" rx="24" fill="url(#orange-grad)" />
    
    <!-- Checkmark (Offset significantly to the right to create a distinct gap) -->
    <path d="M 264,258 
             L 316,314 
             C 319,317 324,317 327,314
             L 438,180" fill="none" stroke="url(#blue-grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>